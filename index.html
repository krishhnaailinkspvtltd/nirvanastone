/* SHREE NIRVAN — THE MODERN HEIRLOOM / HOMEPAGE VI
   Rich ivory, ink and antique-copper editorial system. Homepage-scoped rules.
   Standalone CSS/JS, no animation dependencies, keyboard & reduced-motion safe.
*/
body.sn6-home{background:#f5efe4;color:#253d37}
.sn6-root{--sn6-cream:#f5efe4;--sn6-paper:#fbf7ef;--sn6-ink:#233c35;--sn6-moss:#325249;--sn6-clay:#a46b55;--sn6-gold:#c49d68;--sn6-muted:#746f67;--sn6-serif:'Cormorant Garamond',Georgia,serif;--sn6-sans:'DM Sans',Arial,sans-serif;--sn6-ease:cubic-bezier(.19,1,.22,1);overflow:hidden;background:var(--sn6-cream);font-family:var(--sn6-sans)}
.sn6-root *{box-sizing:border-box}
.sn6-root a{text-decoration:none}
.sn6-wrap{width:min(100% - 108px,1390px);margin-inline:auto}
.sn6-section{padding:clamp(90px,10vw,154px) 0}
.sn6-kicker,.sn6-eyebrow{display:inline-flex;align-items:center;gap:11px;font-size:10px;font-weight:700;letter-spacing:.23em;line-height:1.5;color:var(--sn6-clay)}
.sn6-eyebrow-dot{width:7px;height:7px;border:1px solid currentColor;border-radius:50%;position:relative}.sn6-eyebrow-dot:before{content:'';height:3px;width:3px;border-radius:50%;position:absolute;inset:1px;background:currentColor}
.sn6-root h1,.sn6-root h2,.sn6-root h3,.sn6-root p{margin:0}
.sn6-root h1,.sn6-root h2,.sn6-root h3{font-family:var(--sn6-serif);font-weight:500}
.sn6-root h1 i,.sn6-root h2 i{font-weight:400;font-style:italic}
.sn6-root .sn6-button{display:inline-flex;justify-content:center;align-items:center;gap:24px;padding:18px 24px;border:1px solid transparent;border-radius:100px;line-height:1.2;font-size:10px;font-weight:750;letter-spacing:.12em;white-space:nowrap;transition:background .35s,color .35s,transform .45s var(--sn6-ease),box-shadow .35s}
.sn6-button svg,.sn6-underline-link svg,.sn6-collection-link svg,.sn6-product-quick svg{width:20px;height:20px;flex:none}
.sn6-root .sn6-button:hover{transform:translateY(-3px);box-shadow:0 14px 34px #1a342620}
.sn6-button-dark{background:var(--sn6-ink);color:#fff!important}.sn6-button-dark:hover{background:#426154}
.sn6-button-white{background:#f6f2ea;color:var(--sn6-ink)!important}.sn6-button-white:hover{background:#fff}
.sn6-button-light{background:#e7d2ae;color:#283e35!important}.sn6-button-light:hover{background:#fff4da}
.sn6-button-outline{background:transparent;color:#f6e7d0!important;border-color:#a99c8a!important}.sn6-button-outline:hover{background:#ffffff1b}
.sn6-underline-link{display:inline-flex;align-items:center;gap:21px;color:var(--sn6-ink);padding-bottom:11px;border-bottom:1px solid #a19a8a;font-size:10px;font-weight:750;letter-spacing:.11em;white-space:nowrap;transition:gap .2s,border .2s}
.sn6-underline-link:hover{gap:31px;border-bottom-color:var(--sn6-ink)}
.sn6-root [data-appear]{opacity:0;transform:translateY(34px);transition:opacity .9s var(--sn6-ease),transform 1.05s var(--sn6-ease)}
.sn6-root [data-appear].sn6-is-visible{opacity:1;transform:none}
.sn6-home .announcement{background:#263d35;color:#ebe1cc}
.sn6-home .announcement span{background:#bda279}
.sn6-home .header-wrap{padding-top:13px;z-index:85}
.sn6-home .header{background:rgba(255,250,242,.88);border-color:#fff9ee;box-shadow:0 14px 42px #344b3e16}
.sn6-home .header-wrap.scrolled .header{background:rgba(250,245,236,.95)}
.sn6-home .nav-links a.active,.sn6-home .nav-links a:hover{background:#e2e8dd;color:#254238}
.sn6-home .brand-mark{background:#365348!important}
.sn6-home .footer{background:#20372f}
.sn6-home .footer .brand-mark{background:#3c6152!important}
.sn6-home .count{background:#a36e54}
.sn6-home .page-reading-progress{background:#bb9673}
/* HERO — asymmetrical editorial cover with floating product-study cards */
.sn6-hero{position:relative;min-height:790px;padding:163px 0 0;background:radial-gradient(ellipse at 71% 49%,#f2e2cd 0,transparent 43%),radial-gradient(ellipse at 15% 8%,#faf6eb 0,transparent 53%),#f4ede2;isolation:isolate}

.sn6-hero-orbit{position:absolute;right:-110px;top:60px;width:750px;aspect-ratio:1;border:1px solid #bd9a7570;border-radius:50%;pointer-events:none;opacity:.36}
.sn6-hero-layout{display:grid;grid-template-columns:51% 49%;align-items:center;min-height:570px;position:relative}
.sn6-hero-content{position:relative;z-index:5;padding:0 0 22px}
.sn6-hero .sn6-eyebrow{color:#895e49;margin-bottom:32px}
.sn6-hero-title{font-size:clamp(84px,8.4vw,144px);line-height:.765;letter-spacing:-.078em;color:#1e3930;position:relative;white-space:nowrap}
.sn6-hero-title i{color:#af7659}.sn6-hero-title>span{color:#be9470}

.sn6-hero-actions{display:flex;align-items:center;gap:34px;margin-top:34px}
.sn6-text-link{display:inline-flex;gap:23px;align-items:center;font-size:10px;letter-spacing:.09em;font-weight:700;color:#405c4d;border-bottom:1px solid #8a9a86;padding-bottom:7px;white-space:nowrap}
.sn6-text-link span{font-size:19px;font-weight:400;transition:transform .3s}.sn6-text-link:hover span{transform:translate(4px,-4px)}
.sn6-hero-index{margin-top:87px;max-width:550px;border-top:1px solid #9b967f88;display:flex;align-items:center;justify-content:space-between;padding-top:18px;font-size:9px;font-weight:750;letter-spacing:.16em;color:#928371}
.sn6-hero-index b{font-size:19px;font-weight:400;color:#9b6950;margin-left:17px}
.sn6-hero-art{position:relative;height:620px;min-width:0;--px:0;--py:0}

.sn6-art-top{font-size:9px;letter-spacing:.18em;color:#776956;display:flex;justify-content:space-between;padding:3px 8px 12px;font-weight:700}.sn6-art-top b{font-size:18px;font-weight:400}
.sn6-art-photo{width:100%;height:370px;border-radius:50% 50% 11px 11px;overflow:hidden;background:#f2e3d7}.sn6-art-photo img{width:100%;height:100%;object-fit:cover;object-position:center;transition:transform 1s var(--sn6-ease)}
.sn6-art-frame:hover .sn6-art-photo img{transform:scale(1.055)}
.sn6-art-bottom{padding:17px 10px 11px;display:flex;flex-direction:column;gap:5px}.sn6-art-bottom span{font-size:9px;letter-spacing:.19em;color:#796b5f;font-weight:650}.sn6-art-bottom strong{font:500 30px/1 var(--sn6-serif);letter-spacing:-.03em;color:#2d4037}
.sn6-art-floating{position:absolute;width:166px;padding:8px;background:#fbf4e9;border:1px solid #fff5e6;border-radius:12px;box-shadow:0 25px 46px #715f3d36;z-index:4;transition:transform .4s var(--sn6-ease)}
.sn6-art-floating img{height:141px;width:100%;object-fit:cover;border-radius:7px}.sn6-art-floating>span{display:flex;justify-content:space-between;align-items:center;font-size:8px;letter-spacing:.08em;color:#5b5549;padding:11px 4px 3px;font-weight:750}.sn6-art-floating b{font-size:14px;font-weight:500}.sn6-art-floating-one{top:100px;left:0;transform:rotate(-12deg) translate3d(calc(var(--px)*20px),calc(var(--py)*20px),0)}.sn6-art-floating-two{right:-5%;bottom:105px;transform:rotate(11deg) translate3d(calc(var(--px)*-16px),calc(var(--py)*-16px),0)}
.sn6-art-floating-one:hover{transform:rotate(-7deg) translateY(-12px)}.sn6-art-floating-two:hover{transform:rotate(7deg) translateY(-12px)}
.sn6-art-asterisk{position:absolute;right:0;top:20px;font-size:49px;color:#af8c66;animation:sn6-orbit 38s linear infinite}.sn6-art-vertical{position:absolute;right:-50px;top:43%;writing-mode:vertical-rl;font-size:9px;letter-spacing:.19em;color:#998875}
.sn6-hero-bottom{position:relative;display:flex;align-items:center;gap:25px;padding:15px 0 28px;font-size:9px;letter-spacing:.2em;font-weight:700;color:#908576}.sn6-hero-line{height:1px;background:#b2a28e;flex:1}
/* TICKER */
.sn6-ticker{height:79px;background:#27483d;color:#e8d7ae;display:flex;align-items:center;overflow:hidden}.sn6-ticker-inner{display:flex;align-items:center;white-space:nowrap;width:max-content;gap:30px;animation:sn6-ticker 55s linear infinite}.sn6-ticker-inner span{font:400 31px/1 var(--sn6-serif);letter-spacing:-.01em}.sn6-ticker-inner span:nth-child(even){font:400 18px var(--sn6-sans);color:#c5a473}
@keyframes sn6-ticker{to{transform:translateX(-50%)}}@keyframes sn6-orbit{to{transform:rotate(360deg)}}
/* Intro essay */
.sn6-intro{background:#f7f2e9;padding:115px 0 122px}.sn6-intro-grid{display:grid;grid-template-columns:160px 1fr 295px;gap:7%;align-items:start}.sn6-section-index{display:flex;gap:16px;flex-direction:column;font-size:10px;letter-spacing:.12em;font-weight:750;color:#917d6d;padding-top:15px}.sn6-index-line{width:70px;height:1px;background:#ac9481}.sn6-intro h2{font:500 clamp(51px,5vw,86px)/.98 var(--sn6-serif);letter-spacing:-.065em;color:#253f36;margin-top:25px}.sn6-intro h2 i{color:#aa765c}.sn6-intro-aside{padding-top:76px}.sn6-intro-aside p{font-size:14px;line-height:1.9;color:#6b7167;margin-bottom:30px}
/* collection masonry */
.sn6-collections{background:#e7eadd;color:#2d4237}.sn6-heading-grid{display:flex;align-items:end;justify-content:space-between;gap:40px;margin-bottom:54px}.sn6-heading-grid h2{font:500 clamp(70px,7vw,108px)/.95 var(--sn6-serif);letter-spacing:-.06em;color:#253e35;margin-top:19px}.sn6-heading-grid h2 i{color:#aa795a}.sn6-heading-side{max-width:305px;text-align:right;padding-bottom:6px}.sn6-heading-side p{font-size:13px;line-height:1.8;color:#68746a;margin:0 0 22px}.sn6-collection-grid{display:grid;grid-template-columns:1.11fr 1fr 1fr;grid-template-rows:360px 330px;gap:16px}.sn6-collection{position:relative;display:block;min-width:0;overflow:hidden;background:#c1b3a0;border-radius:12px;color:#fff}.sn6-collection-wide{grid-row:span 2}.sn6-collection-image,.sn6-collection-image img{width:100%;height:100%;display:block}.sn6-collection-image img{object-fit:cover;transition:transform 1.1s var(--sn6-ease),filter 1s;filter:saturate(.82)}.sn6-collection:hover .sn6-collection-image img{transform:scale(1.08);filter:saturate(1)}.sn6-collection-scrim{position:absolute;inset:0;background:linear-gradient(0deg,#1d2a24d9 0,transparent 62%),linear-gradient(180deg,#1d262633,transparent 35%);pointer-events:none}.sn6-collection-meta{position:absolute;bottom:24px;left:29px;right:25px;pointer-events:none}.sn6-collection-meta>span{font-size:9px;letter-spacing:.14em;color:#f4e2c6;font-weight:700}.sn6-collection-meta h3{font:500 clamp(37px,3.4vw,61px)/.96 var(--sn6-serif);letter-spacing:-.045em;margin:13px 0 6px}.sn6-collection-wide .sn6-collection-meta h3{font-size:clamp(55px,5vw,80px)}.sn6-collection-meta p{font-size:12px;color:#f4e8d8;line-height:1.6}.sn6-collection-link{position:absolute;right:21px;top:19px;display:flex;align-items:center;gap:13px;font-size:8px;letter-spacing:.10em;color:#fff;background:#203b35b8;border:1px solid #ffffff73;border-radius:100px;padding:9px 10px 9px 17px;backdrop-filter:blur(10px)}.sn6-collection-link svg{width:18px;height:18px}
/* cinematic full-bleed chapter */
.sn6-cinema{position:relative;height:min(850px,86svh);min-height:620px;background:#1a3129;color:white;isolation:isolate;overflow:hidden}.sn6-cinema-photo{position:absolute;inset:-45px;z-index:-2;overflow:hidden}.sn6-cinema-photo>img{width:100%;height:100%;object-fit:cover;object-position:65% 50%;transform:scale(1.085);filter:saturate(.76)}.sn6-cinema-grain{position:absolute;inset:0;background:#1d302216;mix-blend-mode:multiply}.sn6-cinema-overlay{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#102a24ef 0,#102a24be 39%,#102a2417 83%),linear-gradient(0deg,#0b221c66,transparent 45%)}.sn6-cinema-content{height:100%;display:flex;flex-direction:column;align-items:start;justify-content:center;padding-block:70px}.sn6-cinema-content>span{font-size:10px;letter-spacing:.20em;color:#dcc6a0;font-weight:650}.sn6-cinema h2{font:500 clamp(93px,10vw,170px)/.82 var(--sn6-serif);letter-spacing:-.07em;margin:42px 0 34px}.sn6-cinema h2 i{color:#e9c99a}.sn6-cinema-content p{max-width:370px;font-size:14px;line-height:1.85;color:#e8e9dc;margin-bottom:36px}.sn6-cinema-caption{position:absolute;bottom:38px;right:60px;font-size:9px;letter-spacing:.25em;color:#ece5d4}
/* Zodiac chapter */
.sn6-zodiac{background:radial-gradient(ellipse at 75% 56%,#506759 0,#2a443c 49%,#1b3029 100%);color:#f8f1e3}.sn6-zodiac-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:6%;align-items:center;min-height:680px}.sn6-zodiac .sn6-kicker{color:#d1b38a}.sn6-zodiac h2{font:500 clamp(79px,7vw,117px)/.88 var(--sn6-serif);letter-spacing:-.065em;margin:25px 0 28px;color:#fbf3e3}.sn6-zodiac h2 i{color:#ddc0a0}.sn6-zodiac-intro>p{max-width:490px;color:#dedad0;font-size:14px;line-height:1.85;margin-bottom:29px}.sn6-sign-selector{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;max-width:510px;margin-bottom:28px}.sn6-sign{display:flex;flex-direction:column;gap:7px;align-items:center;justify-content:center;min-height:74px;padding:9px 4px;color:#f0e4ce;border:1px solid #d8c6a94d;border-radius:12px;background:#ffffff0c;transition:background .25s,border-color .25s,transform .3s;cursor:pointer}.sn6-sign span{font-family:Georgia,serif;font-size:27px;font-weight:400;line-height:1}.sn6-sign small{font-size:9px;letter-spacing:.03em;color:#e3d8c9}.sn6-sign:hover,.sn6-sign.is-active{border-color:#edc79c;background:#d6bb9340;transform:translateY(-3px)}.sn6-sign:focus-visible{outline:2px solid #fff;outline-offset:3px}.sn6-zodiac-note{display:block;color:#b7c0b4;font-size:10px;line-height:1.5;margin-top:22px;max-width:420px}.sn6-zodiac-display{min-height:640px;position:relative;display:grid;place-items:center}.sn6-zodiac-rings{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.sn6-zodiac-rings span{position:absolute;width:99%;aspect-ratio:1;border:1px solid #f0d6aa4d;border-radius:50%}.sn6-zodiac-rings span:last-child{width:79%;border-style:dashed;animation:sn6-orbit 80s linear infinite}.sn6-zodiac-rings:before{content:'✴';position:absolute;top:8%;right:7%;font-size:50px;color:#e3bd8c}.sn6-zodiac-photo{position:relative;z-index:1;width:min(61%,390px);aspect-ratio:.8;padding:13px;background:#f4e6cd45;border:1px solid #e3d3bd9c;border-radius:49% 49% 15px 15px;box-shadow:0 25px 65px #091d195c;transform:rotate(5deg)}.sn6-zodiac-photo img{display:block;width:100%;height:100%;object-fit:cover;border-radius:48% 48% 8px 8px;transition:opacity .2s,transform .4s}.sn6-zodiac-photo img.sn6-image-changing{opacity:.16;transform:scale(.95)}.sn6-zodiac-panel{position:absolute;z-index:2;left:1%;bottom:4%;padding:25px 30px;background:#f8f1e7f0;backdrop-filter:blur(20px);border:1px solid #fff;border-radius:16px;color:#2f483f;min-width:320px;box-shadow:0 20px 50px #0c1e1a3b}.sn6-zodiac-panel>span{display:flex;align-items:center;justify-content:space-between;font-size:9px;letter-spacing:.18em;color:#927051}.sn6-zodiac-panel>span b{font-size:18px;font-weight:400}.sn6-zodiac-panel h3{font:500 53px/1 var(--sn6-serif);letter-spacing:-.04em;margin:13px 0 4px}.sn6-zodiac-panel h3 i{font:400 30px Georgia,serif;color:#aa7858}.sn6-zodiac-panel p{font-size:12px;color:#4c6b60;line-height:1.5;margin:10px 0 8px}.sn6-zodiac-panel small{font-size:10px;color:#877969}
/* Selected products, existing modal/cart/wishlist action handlers */
.sn6-products{background:#fcf8f1}.sn6-product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.sn6-product{min-width:0;transition:transform .35s}.sn6-product:hover{transform:translateY(-4px)}.sn6-product-art{position:relative;aspect-ratio:.83;border-radius:13px;background:#f1e8df;overflow:hidden}.sn6-product-art>a{display:block;width:100%;height:100%}.sn6-product-art img,.sn6-product-art .sn6-sprite{display:block;width:100%;height:100%;object-fit:cover;transition:transform .9s var(--sn6-ease)}.sn6-product:hover img{transform:scale(1.06)}.sn6-sprite{background-size:800% 800%;background-repeat:no-repeat}.sn6-save{position:absolute;right:13px;top:13px;z-index:2;width:37px;height:37px;border:1px solid #ffffffd6;border-radius:50%;background:#faf6f1dd;font-size:24px;line-height:1;color:#47574b;cursor:pointer}.sn6-save.loved{color:#b55c55}.sn6-product-quick{position:absolute;bottom:13px;left:13px;right:13px;display:flex;align-items:center;justify-content:space-between;background:#fbf6eced;color:#243f35;padding:13px 15px;border:0;border-radius:6px;font-weight:750;font-size:10px;letter-spacing:.12em;cursor:pointer;transform:translateY(10px);opacity:0;transition:opacity .3s,transform .3s}.sn6-product-art:hover .sn6-product-quick,.sn6-product-quick:focus-visible{transform:none;opacity:1}.sn6-product-details{padding:20px 3px 0}.sn6-product-details>span{display:block;font-size:9px;letter-spacing:.17em;color:#a07d64;text-transform:uppercase;margin-bottom:9px}.sn6-product-details>a{display:block;font:600 26px/1.03 var(--sn6-serif);color:#2e4039;letter-spacing:-.03em}.sn6-product-details>small{font-size:11px;display:block;color:#81786e;margin-top:12px}.sn6-reference-note{color:#968b80;font-size:11px;margin:25px 0 0!important}
/* Split editorial */

function setupReveal(){const els=$$('[data-appear]');if(reduced||!('IntersectionObserver'in window)){els.forEach(el=>el.classList.add('sn6-is-visible'));return;}const obs=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){e.target.classList.add('sn6-is-visible');obs.unobserve(e.target)}},{threshold:.07,rootMargin:'0px 0px -35px 0px'});els.forEach(el=>obs.observe(el));}
function setupSigns(){const buttons=$$('[data-sn6-sign]');if(!buttons.length)return;const image=$('#sn6-zodiac-image'),name=$('#sn6-zodiac-name'),trait=$('#sn6-zodiac-trait'),stone=$('#sn6-zodiac-stone');buttons.forEach(button=>button.addEventListener('click',()=>{const i=Number(button.dataset.sn6Sign),s=signs[i];if(!s)return;buttons.forEach(b=>{const yes=b===button;b.classList.toggle('is-active',yes);b.setAttribute('aria-pressed',String(yes))});image.classList.add('sn6-image-changing');const newImg=`assets/zodiac/${s.name.toLowerCase()}.webp`;const update=()=>{image.src=newImg;image.alt=s.name+' zodiac bracelet reference photograph';name.innerHTML=s.name.toUpperCase()+' <i>'+s.symbol+'</i>';trait.textContent=s.trait;stone.textContent='Traditionally associated: '+s.stone;image.classList.remove('sn6-image-changing')};if(reduced)update();else setTimeout(update,180);}))}
function setupRail(){const rail=$('#sn6-lookbook-rail');if(!rail)return;const unit=()=>{const card=$('.sn6-lookbook-card',rail);return (card?.getBoundingClientRect().width||320)+18};$('#sn6-lookbook-prev')?.addEventListener('click',()=>rail.scrollBy({left:-unit(),behavior:reduced?'instant':'smooth'}));$('#sn6-lookbook-next')?.addEventListener('click',()=>rail.scrollBy({left:unit(),behavior:reduced?'instant':'smooth'}));}
function setupPointer(){if(reduced||touch||saveData)return;const stage=$('#sn6-hero-art');if(!stage)return;let raf=0;stage.addEventListener('pointermove',e=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const r=stage.getBoundingClientRect();const x=((e.clientX-r.left)/r.width-.5),y=((e.clientY-r.top)/r.height-.5);stage.style.setProperty('--px',x.toFixed(3));stage.style.setProperty('--py',y.toFixed(3))})},{passive:true});stage.addEventListener('pointerleave',()=>{stage.style.setProperty('--px','0');stage.style.setProperty('--py','0')},{passive:true})}
function setupScroll(){if(reduced)return;const picture=$('.sn6-cinema-photo img'),feature=$('.sn6-feature-image img');let ticking=false;const run=()=>{ticking=false;[[picture,'.sn6-cinema',35],[feature,'.sn6-feature-story',18]].forEach(([img,sel,travel])=>{if(!img)return;const rect=$(sel).getBoundingClientRect();if(rect.bottom<0||rect.top>innerHeight)return;const pct=(innerHeight-rect.top)/(innerHeight+rect.height);img.style.transform=`translate3d(0,${(pct-.5)*travel}px,0) scale(1.085)`})};addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(run)}},{passive:true});run()}
function start(){const main=$('#page-main');if(!main)return;for(const sign of signs){const item=(window.SHREE_NIRVAN_ZODIAC_PRODUCTS||[]).find(x=>x.zodiacSign===sign.name);if(item){sign.trait=item.zodiacHeadline||sign.trait;sign.stone=item.zodiacStones||sign.stone}}document.body.classList.add('sn6-home');main.innerHTML=homeMarkup();setupReveal();setupSigns();setupRail();setupPointer();setupScroll();}
