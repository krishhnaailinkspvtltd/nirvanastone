services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Persists the fallback order store across restarts (only used when
      # Supabase env vars are absent).
      - order-data:/app/.data

  # Cloudflare Tunnel — create the tunnel in the Zero Trust dashboard,
  # point it at http://web:3000, and put the token in .env as TUNNEL_TOKEN.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web

volumes:
  order-data:
